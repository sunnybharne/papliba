name: Website or documentation bug
description: Report a reproducible problem in the public Papliba site, docs, or repository tooling.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This public tracker covers only the Papliba website, public documentation, and repository tooling. Do not paste or attach private application or enterprise code, customer data, credentials, or session transcripts.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.8.0-alpha.1 or commit SHA
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include a clear description and the result you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open…
        2. Select…
        3. Observe…
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, operating system, Node version, or other relevant details

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add public-site logs or screenshots after removing private data. Do not include content from private Papliba repositories.
