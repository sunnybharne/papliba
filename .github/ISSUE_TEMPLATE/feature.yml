name: Website or documentation idea
description: Propose an improvement to the public Papliba site, docs, or repository tooling.
title: 'idea: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What public-site or documentation problem should we solve?
      description: Describe the situation before proposing a change. Do not paste or attach private application or enterprise code.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Explain the smallest change that would improve the situation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Product site
        - Documentation
        - Contributor workflow
        - Other
    validations:
      required: true

  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs or alternatives
      description: Note security, complexity, accessibility, or scope concerns you can already see.
